# /etc/dnsmasq.d/hub.conf — copia real del hub (respaldo 2026-11-17, Fase 2.3)
# --- Dónde escucha (convive con systemd-resolved) ---
interface=eth0
except-interface=lo
bind-dynamic

# --- DNS ---
domain-needed
bogus-priv
no-resolv
server=1.1.1.1
server=9.9.9.9
cache-size=10000
local=/hub.lan/
domain=hub.lan
address=/portal.hub.lan/10.20.0.162
address=/cdn.hub.lan/10.20.0.162
address=/wiki.hub.lan/10.20.0.162
host-record=mikrotik.hub.lan,10.20.0.161
host-record=ap.hub.lan,10.20.0.163
# Páginas del Hotspot (status) también después de iniciar sesión
host-record=wifi-publica.hub.lan,10.20.0.1
host-record=wifi-salud.hub.lan,10.20.0.129

# --- DHCP ---
dhcp-authoritative
log-dhcp
dhcp-range=set:admin,10.20.0.170,10.20.0.174,255.255.255.240,24h
dhcp-range=set:salud,10.20.0.135,10.20.0.158,255.255.255.224,8h
dhcp-range=set:publica,10.20.0.10,10.20.0.126,255.255.255.128,30m
dhcp-option=tag:admin,option:router,10.20.0.161
dhcp-option=tag:salud,option:router,10.20.0.129
dhcp-option=tag:publica,option:router,10.20.0.1
dhcp-option=option:dns-server,10.20.0.162
dhcp-option=option:ntp-server,10.20.0.162
