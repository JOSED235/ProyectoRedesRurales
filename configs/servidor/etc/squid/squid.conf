# /etc/squid/squid.conf — copia real del hub (respaldo 2026-11-17, Fase 2.3)
acl redes_hub src 10.20.0.0/24
acl SSL_ports port 443
acl Safe_ports port 80 443 21 1025-65535
acl CONNECT method CONNECT
http_access deny !Safe_ports
http_access deny CONNECT !SSL_ports
http_access allow localhost manager
http_access deny manager
http_access allow redes_hub
http_access allow localhost
http_access deny all

http_port 3128
http_port 3129 intercept

cache_mem 256 MB
maximum_object_size 512 MB
cache_dir aufs /srv/cdn/squid 4000 16 256
cache_replacement_policy heap LFUDA

refresh_pattern -i \.(deb|zip|gz|xz|iso|exe|apk|pdf|mp4|webm)$ 10080 90% 43200
refresh_pattern -i \.(jpg|jpeg|png|gif|webp|svg|css|js)$ 1440 80% 10080
refresh_pattern -i (/cgi-bin/|\?) 0 0% 0
refresh_pattern . 0 20% 4320

dns_nameservers 10.20.0.162
forwarded_for delete
visible_hostname hub.hub.lan
access_log daemon:/var/log/squid/access.log squid
