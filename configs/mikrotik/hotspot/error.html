<!doctype html>
<!-- hotspot/error.html — errores generales del Hotspot. El texto de $(error) sale de errors.txt. Usa hub.css. -->
<html lang="es">
<head>
<meta charset="utf-8">
<meta http-equiv="pragma" content="no-cache">
<meta http-equiv="expires" content="-1">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light dark">
<title>Hub Rural · Algo salió mal</title>
<link rel="stylesheet" href="hub.css">
</head>
<body>

<main class="card">
  <h1>Algo salió mal</h1>
  <p class="alert" role="alert">$(error)</p>
  <a class="btn" href="$(link-login)">Intentar de nuevo</a>
  <a class="btn sec" href="https://portal.hub.lan">Ver contenido sin conexión</a>
</main>

<p class="pie">Si se repite, pide ayuda en el puesto.</p>
</body>
</html>
